[project]
name = "gs-agro-api"
version = "1.0.0"
description = "HTTP job service for the SDU UAS Center agricultural tool chain (CDC, crop-row-detector, crop-row-connector)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.18",
    "httpx>=0.27",
]

[dependency-groups]
# The processing tools themselves. In the image crop-row-connector is built from the pinned
# submodule (upstream/crop-row-connector); locally the PyPI release is enough for the tests.
tools = [
    "cdc>=1.1.4",
    "crop-row-detector>=0.3.0",
    "crop-row-connector>=1.3.0",
]
test = ["pytest>=8"]
lint = ["ruff>=0.8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]
